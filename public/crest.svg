<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE270"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E1065"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4338CA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="#07090e"/>
  <circle cx="256" cy="220" r="180" fill="url(#bgGlow)"/>
  
  <!-- Outer Ornate Shield Outline -->
  <path d="M256 32 C360 32 440 60 440 160 C440 310 350 420 256 464 C162 420 72 310 72 160 C72 60 152 32 256 32 Z" 
        fill="url(#purpleGrad)" stroke="url(#goldGrad)" stroke-width="12"/>

  <!-- Inner Gold Inset Line -->
  <path d="M256 50 C345 50 418 75 418 165 C418 295 338 395 256 438 C174 395 94 295 94 165 C94 75 167 50 256 50 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6,4" opacity="0.85"/>

  <!-- Top Radiant Sun of Enlightenment -->
  <g transform="translate(256, 130)">
    <!-- Sun Rays -->
    <g stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.95">
      <line x1="0" y1="-48" x2="0" y2="-64"/>
      <line x1="34" y1="-34" x2="46" y2="-46"/>
      <line x1="48" y1="0" x2="64" y2="0"/>
      <line x1="34" y1="34" x2="46" y2="46"/>
      <line x1="-34" y1="-34" x2="-46" y2="-46"/>
      <line x1="-48" y1="0" x2="-64" y2="0"/>
      <line x1="-34" y1="34" x2="-46" y2="46"/>
    </g>
    <!-- Sun Core -->
    <circle r="32" fill="url(#sunGrad)" stroke="#FFE270" stroke-width="3"/>
    <!-- 6-Point Academic Star -->
    <polygon points="0,-20 6,-6 20,-6 10,4 14,18 0,10 -14,18 -10,4 -20,-6 -6,-6" fill="#1E1B4B"/>
  </g>

  <!-- Golden Horseshoe of Gallant Strides -->
  <path d="M176 175 C176 130 336 130 336 175 C336 215 315 250 305 265 C295 245 305 210 305 175 C305 155 207 155 207 175 C207 210 217 245 207 265 C197 250 176 215 176 175 Z" 
        fill="url(#goldGrad)" opacity="0.4"/>

  <!-- Academic Mortarboard Cap (Center Top) -->
  <g transform="translate(256, 210)">
    <polygon points="0,-26 65,-2 0,22 -65,-2" fill="#FFE270" stroke="#B45309" stroke-width="3"/>
    <polygon points="-42,5 0,20 42,5 42,16 0,31 -42,16" fill="#F59E0B"/>
    <!-- Tassel -->
    <path d="M38 4 Q50 15 54 36" fill="none" stroke="#FEF08A" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="54" cy="38" r="4" fill="#FEF08A"/>
  </g>

  <!-- Open Book of Scholarship & Wisdom (Center) -->
  <g transform="translate(256, 285)">
    <!-- Left Page -->
    <path d="M-8 40 C-45 32 -95 38 -105 10 C-105 -25 -55 -20 -8 -12 Z" 
          fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="4"/>
    <!-- Right Page -->
    <path d="M8 40 C45 32 95 38 105 10 C105 -25 55 -20 8 -12 Z" 
          fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="4"/>
    <!-- Book Spine -->
    <path d="M-8 -12 Q0 -16 8 -12 L8 40 Q0 36 -8 40 Z" fill="url(#goldGrad)"/>
    
    <!-- Text Lines on Pages -->
    <g stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <line x1="-85" y1="0" x2="-25" y2="-5"/>
      <line x1="-85" y1="12" x2="-25" y2="7"/>
      <line x1="-80" y1="24" x2="-25" y2="19"/>
      <line x1="25" y1="-5" x2="85" y2="0"/>
      <line x1="25" y1="7" x2="85" y2="12"/>
      <line x1="25" y1="19" x2="80" y2="24"/>
    </g>
  </g>

  <!-- Flanking Laurel Wreath / Olive Branches of Victory -->
  <g stroke="url(#goldGrad)" fill="url(#goldGrad)" stroke-width="2" opacity="0.95">
    <!-- Left Branch -->
    <path d="M110 320 C105 270 120 220 145 180" fill="none" stroke-width="4" stroke-linecap="round"/>
    <circle cx="118" cy="290" r="6"/>
    <circle cx="112" cy="260" r="6"/>
    <circle cx="120" cy="230" r="6"/>
    <circle cx="134" cy="202" r="6"/>
    <circle cx="152" cy="180" r="6"/>

    <!-- Right Branch -->
    <path d="M402 320 C407 270 392 220 367 180" fill="none" stroke-width="4" stroke-linecap="round"/>
    <circle cx="394" cy="290" r="6"/>
    <circle cx="400" cy="260" r="6"/>
    <circle cx="392" cy="230" r="6"/>
    <circle cx="378" cy="202" r="6"/>
    <circle cx="360" cy="180" r="6"/>
  </g>

  <!-- University Ribbon Banner Base -->
  <g transform="translate(256, 430)">
    <path d="M-180 10 L-140 -12 L140 -12 L180 10 L160 38 L140 22 L-140 22 L-160 38 Z" 
          fill="url(#purpleGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
    
    <text x="0" y="10" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="18" 
          font-weight="900" 
          letter-spacing="3" 
          text-anchor="middle" 
          fill="#FFE270">
      CHRISLAND UNIVERSITY
    </text>
  </g>

  <!-- Motto Subtext -->
  <text x="256" y="370" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="13" 
        font-weight="800" 
        letter-spacing="2" 
        text-anchor="middle" 
        fill="#FDE68A" 
        opacity="0.95">
    LIGHT · INTEGRITY · EXCELLENCE
  </text>
</svg>